<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대출 신청 및 도서조회</title>
    <link rel="stylesheet" href="./loan.css">
    <link rel="stylesheet" href="../common/commonpage.css">
    <link rel="stylesheet" href="../common/reset.css">
</head>
<body>
    <!-- 헤더 -->
    <header>
    <!-- 왼쪽 로고 -->
    <div class="logo">
        <img src="../../image/KH_logo.png" width="50" alt="KH로고">도서관
    </div>

    <!-- 가운데 네브 -->
    <nav class="main-nav">
        <a href="#">대출신청</a>
        <a href="#">희망도서신청</a>
        <a href="#">도서관 이용안내</a>
        <a href="#">공지사항</a>
    </nav>

    <!-- 오른쪽 네브 -->
    <nav class="user-nav">
        <a href="#">홈</a>
        <a href="#">로그아웃</a>
        <a href="#">마이페이지</a>
    </nav>
    </header>

    <div class="layout">
        <!-- 좌측 배너 -->
        <div class="left-banner">
        <h3>마이페이지</h3>
        <a href="#">내 정보 수정</a>
        <hr />
        <a href="#">대출 조회</a>
        <hr />
        <a href="#">희망 도서 신청 조회</a>
        <hr />
        <a href="#">회원 탈퇴</a>
        <hr />
        </div>

    <!-- 본문 -->
    <main class="content">
    <div class="loan-wrap">
    <h1 class="loan-title">도서 대출</h1>

    <div class="search-wrap">
        <input type="text" class="loan-search" placeholder="검색어를 입력하세요" />
    </div>

    <div class="loan-divider"></div>

    <p class="loan-note">○○에 대한 검색 결과입니다</p>

    <section class="loan-grid">
    <!-- 1 -->
    <article class="loan-item">
        <img src="../../image/fox.jpg" alt="도서표지" class="book-img" />
        <div class="info">
            <div class="book-name">책을먹는여우</div>
            <button class="apply-btn">신청하기</button>
        </div>
    </article>

    <!-- 2 -->
    <article class="loan-item">
        <img src="../../image/math.jpg" alt="도서표지" class="book-img" />
        <div class="info">
            <div class="book-name">수학의정석미적분I</div>
            <button class="apply-btn">신청하기</button>
            </div>
    </article>

    <!-- 3 -->
    <article class="loan-item">
        <img src="../../image/Bang.jpg" alt="도서표지" class="book-img" />
        <div class="info">
            <div class="book-name">뺑덕</div>
            <button class="apply-btn">신청하기</button>
        </div>
    </article>

    <!-- 4 -->
    <article class="loan-item">
        <img src="../../image/tree.jpg" alt="도서표지" class="book-img" />
        <div class="info">
            <div class="book-name">아낌없이주는나무</div>
            <button class="apply-btn">신청하기</button>
        </div>
    </article>
    </section>
    </div>
</main>
    </div>
    <!-- 푸터 -->
    <footer>
    <div class="footer-container">
    <!-- 왼쪽 -->
    <div class="footer-left">
        <img src="../../image/KH_logo.png" width="40" alt="KH도서관 로고">
        <div class="footer-text">
        <div class="top-line">
            <strong>KH도서관</strong>
            02742 서울특별시 중구 장충제일로 212 | TEL 02-2412-1113
        </div>
        <div class="bottom-line">
            Copyright(c) KH Library. All Rights Reserved
        </div>
        </div>
    </div>

    <!-- 가운데 -->
    <div class="footer-center">
        <img src="../../image/KOGL.jpg" width="80" alt="공공누리">
        <img src="../../image/" width="40" alt="OPEN">
        <img src="../../image/" width="40" alt="서비스마크">
    </div>

    <!-- 오른쪽 -->
    <div class="footer-right">
        <a href="#"><img src="../../image/korea.png" width="28" alt="한국"></a>
        <a href="#"><img src="../../image/youtube.png" width="28" alt="유튜브"></a>
        <a href="#"><img src="../../image/instagram.png" width="28" alt="인스타그램"></a>
        <a href="#"><img src="../../image/facebook.png" width="28" alt="페이스북"></a>
        <a href="#"><img src="../../image/X.png" width="28" alt="X"></a>
    </div>
    </div>
</footer>
</body>
</html>
